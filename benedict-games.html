<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benedict's L/l Games</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700&display=swap');

  :root{
    --cream:#FBF6EC;
    --ink:#22333B;
    --gold:#E8A33D;
    --gold-dark:#B87A22;
    --terracotta:#C1592B;
    --leaf:#3E8E5A;
    --leaf-dark:#2A6B3F;
    --softgray:#DCD5C6;
    --card:#FFFFFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    font-family:'Atkinson Hyperlegible', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 48px;
  }

  .wrap{ width:100%; max-width:520px; }

  header{ text-align:center; margin-bottom:22px; }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:2.1rem;
    font-weight:700;
    color:var(--terracotta);
    margin:0;
  }

  .sub{ font-size:1rem; color:var(--ink); opacity:0.75; margin:6px 0 0; }

  .mascot-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border-radius:16px;
    padding:14px 16px; margin-bottom:22px;
    box-shadow:0 3px 0 var(--softgray);
  }

  .mascot{ width:52px; height:52px; flex-shrink:0; }

  .bubble{ font-weight:700; font-size:0.95rem; line-height:1.3; }
  .bubble .twi{ display:block; font-weight:400; font-size:0.82rem; color:var(--terracotta); margin-top:2px; }

  .card-link{
    display:flex; align-items:center; gap:14px;
    background:var(--card);
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 3px 0 var(--softgray);
  }

  .card-link:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--softgray); }

  .icon{
    width:52px; height:52px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.8rem;
    flex-shrink:0;
  }

  .icon.gold{ background:var(--gold); }
  .icon.leaf{ background:var(--leaf); }

  .card-text h2{
    font-family:'Baloo 2', sans-serif;
    font-size:1.15rem;
    margin:0 0 3px;
  }

  .card-text p{ margin:0; font-size:0.85rem; opacity:0.75; }

  footer{ text-align:center; margin-top:24px; font-size:0.8rem; opacity:0.55; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 Benedict's L/l Games</h1>
    <p class="sub">Pick a game to play</p>
  </header>

  <div class="mascot-row">
    <svg class="mascot" viewBox="0 0 60 60" fill="none">
      <ellipse cx="30" cy="34" rx="13" ry="15" fill="#22333B"/>
      <circle cx="30" cy="16" r="9" fill="#22333B"/>
      <circle cx="26" cy="15" r="2.2" fill="#FBF6EC"/>
      <circle cx="34" cy="15" r="2.2" fill="#FBF6EC"/>
      <circle cx="26" cy="15" r="1" fill="#22333B"/>
      <circle cx="34" cy="15" r="1" fill="#22333B"/>
      <path d="M16 34 L4 28 M16 38 L3 40 M16 42 L5 50" stroke="#22333B" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M44 34 L56 28 M44 38 L57 40 M44 42 L55 50" stroke="#22333B" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="bubble">
      Ready to play, Benedict?
      <span class="twi">Anansi says: yɛ ho aniɛden! (get ready!)</span>
    </div>
  </div>

  <a class="card-link" href="l-detective.html">
    <div class="icon gold">🔎</div>
    <div class="card-text">
      <h2>L Detective</h2>
      <p>Find every L and l hiding among look-alike letters.</p>
    </div>
  </a>

  <a class="card-link" href="l-word-builder.html">
    <div class="icon leaf">🧩</div>
    <div class="card-text">
      <h2>L Word Builder</h2>
      <p>Build lion, leaf, and log letter by letter.</p>
    </div>
  </a>

  <footer>Made for Benedict's reading remediation intervention</footer>
</div>
</body>
</html>
