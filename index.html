<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Builder - Pilot Test</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;
    
    const PatternBuilder = () => {
      const [phase, setPhase] = useState('welcome');
      const [currentPattern, setCurrentPattern] = useState(0);
      const [showCelebration, setShowCelebration] = useState(false);
      const [completedPatterns, setCompletedPatterns] = useState([]);

      const patterns = [
        { id: 1, sequence: ['🔴', '🔵', '🔴'], difficulty: 'easy' },
        { id: 2, sequence: ['🟢', '🟡', '🟢', '🟡'], difficulty: 'easy' },
        { id: 3, sequence: ['🔴', '🔵', '🟢', '🔴', '🔵', '🟢'], difficulty: 'medium' },
        { id: 4, sequence: ['🟡', '🟡', '🔵', '🟡', '🟡', '🔵'], difficulty: 'medium' }
      ];

      const playSuccessSound = () => {
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
          oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
          oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
          
          gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.5);
        } catch (e) {
          console.log('Audio not supported');
        }
      };

      const handleComplete = () => {
        playSuccessSound();
        setShowCelebration(true);
        setCompletedPatterns([...completedPatterns, currentPattern]);
        
        setTimeout(() => {
          setShowCelebration(false);
          if (currentPattern < patterns.length - 1) {
            setCurrentPattern(currentPattern + 1);
          } else {
            setPhase('freeCreate');
          }
        }, 2500);
      };

      const Confetti = () => {
        const pieces = Array.from({ length: 30 }, (_, i) => ({
          id: i,
          left: Math.random() * 100,
          delay: Math.random() * 0.5,
          color: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'][Math.floor(Math.random() * 5)]
        }));

        return React.createElement('div', { className: 'fixed inset-0 pointer-events-none z-50' },
          pieces.map(piece =>
            React.createElement('div', {
              key: piece.id,
              className: 'absolute w-2 h-2 rounded-full animate-fall',
              style: {
                left: `${piece.left}%`,
                backgroundColor: piece.color,
                animationDelay: `${piece.delay}s`,
                top: '-10px'
              }
            })
          )
        );
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 p-8">
          <style>{`
            @keyframes fall {
              to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
              }
            }
            .animate-fall {
              animation: fall 2s ease-in forwards;
            }
          `}</style>

          {showCelebration && <Confetti />}

          <div className="max-w-4xl mx-auto">
            
            {phase === 'welcome' && (
              <div className="bg-white rounded-3xl shadow-2xl p-12 text-center">
                <div className="mb-6">
                  <svg className="w-24 h-24 mx-auto text-yellow-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                  </svg>
                </div>
                <h1 className="text-5xl font-bold text-gray-800 mb-6">
                  Welcome, Pattern Builder!
                </h1>
                <p className="text-2xl text-gray-700 mb-8 leading-relaxed">
                  Today you will build patterns with colors.
                </p>

                <div className="bg-gradient-to-r from-purple-100 to-blue-100 rounded-2xl p-8 mb-8">
                  <p className="text-xl text-gray-800 mb-6 font-semibold">
                    This is a pattern:
                  </p>
                  <div className="flex justify-center gap-4 mb-8">
                    <div className="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-3xl">
                      🔴
                    </div>
                    <div className="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center text-3xl">
                      🔵
                    </div>
                    <div className="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-3xl">
                      🔴
                    </div>
                  </div>
                  <p className="text-lg text-gray-700">
                    See? Red, Blue, Red - that's a pattern!
                  </p>
                </div>

                <button
                  onClick={() => setPhase('building')}
                  className="bg-gradient-to-r from-green-500 to-blue-500 text-white text-2xl font-bold px-12 py-6 rounded-full hover:shadow-2xl transition-all transform hover:scale-110"
                >
                  Let's Build Patterns! 🚀
                </button>
              </div>
            )}

            {phase === 'building' && (
              <div className="bg-white rounded-3xl shadow-2xl p-8">
                
                <div className="flex items-center justify-between mb-8">
                  <h2 className="text-3xl font-bold text-gray-800">
                    Pattern {currentPattern + 1} of {patterns.length}
                  </h2>
                  <div className="flex gap-3">
                    {patterns.map((_, idx) => (
                      <div
                        key={idx}
                        className={`w-4 h-4 rounded-full transition-all ${
                          completedPatterns.includes(idx) ? 'bg-green-500 scale-110' :
                          idx === currentPattern ? 'bg-blue-500 animate-pulse' : 'bg-gray-300'
                        }`}
                      />
                    ))}
                  </div>
                </div>

                <div className="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-2xl p-12 mb-8">
                  <p className="text-2xl text-gray-800 text-center mb-8 font-semibold">
                    Build this pattern with your objects:
                  </p>
                  <div className="flex justify-center items-center gap-6 flex-wrap">
                    {patterns[currentPattern].sequence.map((color, idx) => (
                      <div
                        key={idx}
                        className="w-24 h-24 rounded-full shadow-xl flex items-center justify-center text-5xl bg-white border-4 border-gray-200 transform hover:scale-105 transition-all"
                      >
                        {color}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-6 mb-8">
                  <p className="text-xl text-gray-700 text-center leading-relaxed">
                    <strong>Instructions for Teacher:</strong><br/>
                    Read this to the student in your language:<br/>
                    "Use your colored objects to make the same pattern you see above."
                  </p>
                </div>

                {showCelebration && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40">
                    <div className="bg-white rounded-3xl p-12 text-center transform scale-110 animate-bounce">
                      <div className="text-8xl mb-4">🎉</div>
                      <h2 className="text-5xl font-bold text-green-600 mb-4">Amazing!</h2>
                      <p className="text-3xl text-gray-700">You're a Pattern Builder!</p>
                    </div>
                  </div>
                )}

                <div className="text-center">
                  <button
                    onClick={handleComplete}
                    className="bg-gradient-to-r from-green-500 to-emerald-600 text-white text-3xl font-bold px-16 py-6 rounded-full hover:shadow-2xl transition-all transform hover:scale-110 inline-flex items-center gap-4"
                  >
                    <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                    </svg>
                    I'm Done!
                  </button>
                </div>

              </div>
            )}

            {phase === 'freeCreate' && (
              <div className="bg-white rounded-3xl shadow-2xl p-12 text-center">
                <div className="mb-6">
                  <svg className="w-24 h-24 mx-auto text-purple-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                  </svg>
                </div>
                <h1 className="text-5xl font-bold text-gray-800 mb-6">
                  🌟 You Did All 4 Patterns! 🌟
                </h1>
                
                <div className="bg-gradient-to-br from-purple-100 to-pink-100 rounded-2xl p-10 mb-8">
                  <p className="text-3xl text-gray-800 mb-8 font-bold">
                    Now it's YOUR turn to be creative!
                  </p>
                  <p className="text-2xl text-gray-700 mb-6 leading-relaxed">
                    Make YOUR OWN pattern.<br/>
                    Use any colors you want!<br/>
                    Make it as long or short as you like!
                  </p>
                  
                  <div className="bg-white rounded-xl p-6 my-8 border-4 border-dashed border-purple-300">
                    <p className="text-xl text-gray-600 mb-4">
                      <strong>For Teacher:</strong>
                    </p>
                    <p className="text-lg text-gray-700 leading-relaxed">
                      1. Let the student create their own pattern<br/>
                      2. Take a photo when they're done<br/>
                      3. Ask: "Tell me about your pattern!"<br/>
                      4. This is your generalization data! 📸
                    </p>
                  </div>

                  <div className="flex justify-center gap-6 mt-8">
                    <svg className="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                  </div>
                </div>

                <button
                  onClick={() => {
                    setPhase('welcome');
                    setCurrentPattern(0);
                    setCompletedPatterns([]);
                  }}
                  className="bg-gradient-to-r from-blue-500 to-purple-500 text-white text-2xl font-bold px-12 py-6 rounded-full hover:shadow-2xl transition-all transform hover:scale-110 inline-flex items-center gap-3"
                >
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  Start Over
                </button>
              </div>
            )}

          </div>
        </div>
      );
    };

    ReactDOM.render(<PatternBuilder />, document.getElementById('root'));
  </script>
</body>
</html>
