<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L Word Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700&display=swap');

  :root{
    --cream:#FBF6EC;
    --ink:#22333B;
    --gold:#E8A33D;
    --gold-dark:#B87A22;
    --terracotta:#C1592B;
    --leaf:#3E8E5A;
    --leaf-dark:#2A6B3F;
    --softgray:#DCD5C6;
    --card:#FFFFFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    font-family:'Atkinson Hyperlegible', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 12px 48px;
  }

  .wrap{ width:100%; max-width:520px; }

  header{ text-align:center; margin-bottom:6px; }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:2rem;
    font-weight:700;
    color:var(--terracotta);
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .sub{ font-size:1rem; color:var(--ink); opacity:0.75; margin:2px 0 14px; text-align:center; }

  .sound-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--terracotta);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    border-radius:14px;
    padding:8px 14px;
    margin:0 auto 18px;
    max-width:340px;
    text-align:center;
  }

  .level-track{ display:flex; justify-content:center; gap:8px; margin-bottom:18px; }

  .level-dot{
    width:34px; height:34px; border-radius:50%;
    background:var(--softgray); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.85rem; border:2px solid transparent;
    text-align:center; line-height:1.1;
  }

  .level-dot.active{ background:var(--gold); color:#fff; border-color:var(--gold-dark); }
  .level-dot.done{ background:var(--leaf); color:#fff; }

  .stage{
    background:var(--card);
    border-radius:20px;
    padding:22px 18px 26px;
    box-shadow:0 3px 0 var(--softgray);
    position:relative;
  }

  .mascot-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }

  .mascot{ width:52px; height:52px; flex-shrink:0; }

  .bubble{
    background:var(--cream);
    border-radius:14px;
    padding:10px 14px;
    font-size:0.95rem;
    font-weight:700;
    line-height:1.3;
    flex:1;
  }

  .instruction{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:1rem;
    margin-bottom:16px;
  }

  .picture{
    font-size:4.5rem;
    text-align:center;
    margin-bottom:18px;
  }

  .row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }

  .slot{
    width:52px; height:60px;
    border-radius:12px;
    border:3px dashed var(--softgray);
    display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; font-weight:700;
    color:var(--ink);
    background:var(--cream);
  }

  .slot.filled{
    border-style:solid;
    border-color:var(--leaf);
    background:var(--leaf);
    color:#fff;
  }

  .slot.fixed{
    border-style:solid;
    border-color:var(--softgray);
    background:var(--card);
    color:var(--ink);
  }

  .tile{
    width:56px; height:56px;
    border-radius:12px;
    border:none;
    background:var(--gold);
    color:#fff;
    box-shadow:0 3px 0 var(--gold-dark);
    font-family:'Atkinson Hyperlegible', sans-serif;
    font-size:1.6rem;
    font-weight:700;
    cursor:pointer;
  }

  .tile:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--gold-dark); }

  .tile.used{ visibility:hidden; }

  .tile.shake{ animation:shake 0.35s ease; }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .slot.shake{ animation:shake 0.35s ease; }

  .actions{ text-align:center; margin-bottom:8px; }

  .link-btn{
    background:none; border:none;
    color:var(--ink); opacity:0.6;
    font-size:0.85rem; text-decoration:underline;
    cursor:pointer;
  }

  .progress-row{
    display:flex; align-items:center; justify-content:space-between;
    font-weight:700; font-size:0.9rem; margin-top:6px;
  }

  .stars{ font-size:1.05rem; letter-spacing:2px; color:var(--softgray); }
  .stars .lit{ color:var(--gold); }

  .complete-overlay{
    position:absolute; inset:0;
    background:rgba(251,246,236,0.97);
    border-radius:20px;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px;
  }

  .complete-overlay.show{ display:flex; }

  .complete-overlay h2{
    font-family:'Baloo 2', sans-serif;
    color:var(--leaf-dark);
    font-size:1.5rem;
    margin:0 0 6px;
  }

  .complete-overlay p{ margin:0 0 18px; font-size:0.95rem; }

  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:600; font-size:1rem;
    background:var(--gold); color:#fff;
    border:none; border-radius:14px;
    padding:12px 24px;
    box-shadow:0 3px 0 var(--gold-dark);
    cursor:pointer;
  }

  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--gold-dark); }

  .restart-row{ text-align:center; margin-top:16px; }

  .restart-row button{
    background:none; border:none;
    color:var(--ink); opacity:0.55;
    font-family:'Atkinson Hyperlegible', sans-serif;
    font-size:0.85rem; text-decoration:underline; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span>🧩</span> L Word Builder</h1>
    <p class="sub">Build the word, letter by letter</p>
  </header>

  <div class="sound-badge">L makes the /l/ sound. Say it out loud as you build!</div>

  <div class="level-track" id="levelTrack"></div>

  <div class="stage">
    <div class="mascot-row">
      <svg class="mascot" viewBox="0 0 60 60" fill="none">
        <ellipse cx="30" cy="34" rx="13" ry="15" fill="#22333B"/>
        <circle cx="30" cy="16" r="9" fill="#22333B"/>
        <circle cx="26" cy="15" r="2.2" fill="#FBF6EC"/>
        <circle cx="34" cy="15" r="2.2" fill="#FBF6EC"/>
        <circle cx="26" cy="15" r="1" fill="#22333B"/>
        <circle cx="34" cy="15" r="1" fill="#22333B"/>
        <path d="M16 34 L4 28 M16 38 L3 40 M16 42 L5 50" stroke="#22333B" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M44 34 L56 28 M44 38 L57 40 M44 42 L55 50" stroke="#22333B" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div class="bubble" id="mascotMsg">Let's build a word!</div>
    </div>

    <p class="instruction" id="instructionText">Click the letter that starts the word.</p>

    <div class="picture" id="picture">🦁</div>

    <div class="row" id="topRow"></div>
    <div class="row" id="bottomRow"></div>

    <div class="actions" id="actionsRow"></div>

    <div class="progress-row">
      <span id="progressText">Word 1 / 3</span>
      <span class="stars" id="starsDisplay"></span>
    </div>

    <div class="complete-overlay" id="completeOverlay">
      <h2 id="completeTitle">Great job!</h2>
      <p id="completeSub">You built every word.</p>
      <button class="btn" id="nextBtn">Next level →</button>
    </div>
  </div>

  <div class="restart-row">
    <button id="restartAll">Start over from level 1</button>
  </div>

</div>

<script>
  const encourage = ["Woho ye!", "You got it!", "Sharp ears and eyes!", "Nice building!"];

  const levels = [
    {
      name: "Find L",
      instruction: "Click the letter that starts the word.",
      mascot: "Which letter does this word start with?",
      words: [
        { emoji: "🦁", word: "LION", options: ["L","O","I","N"] },
        { emoji: "🍃", word: "LEAF", options: ["L","E","A","F"] },
        { emoji: "🪵", word: "LOG",  options: ["L","O","G"] }
      ]
    },
    {
      name: "Complete the word",
      instruction: "Pick the letter that finishes the word.",
      mascot: "One letter is missing. Which one fits?",
      words: [
        { emoji: "🦁", pattern: "L_ON", answer: "I", choices: ["I","A","E"], full: "LION" },
        { emoji: "🍃", pattern: "L_AF", answer: "E", choices: ["E","A","O"], full: "LEAF" },
        { emoji: "🪵", pattern: "L_G",  answer: "O", choices: ["O","A","U"], full: "LOG"  }
      ]
    },
    {
      name: "Build the word",
      instruction: "Tap the letters in the right order to build the word.",
      mascot: "Build it yourself, one letter at a time!",
      words: [
        { emoji: "🦁", word: "LION", bank: ["O","N","L","I"] },
        { emoji: "🍃", word: "LEAF", bank: ["E","A","F","L"] },
        { emoji: "🪵", word: "LOG",  bank: ["G","L","O"] }
      ]
    }
  ];

  let currentLevel = 0;
  let currentWord = 0;
  let misses = 0;
  let builtSoFar = "";

  const picture = document.getElementById('picture');
  const topRow = document.getElementById('topRow');
  const bottomRow = document.getElementById('bottomRow');
  const actionsRow = document.getElementById('actionsRow');
  const instructionText = document.getElementById('instructionText');
  const mascotMsg = document.getElementById('mascotMsg');
  const progressText = document.getElementById('progressText');
  const starsDisplay = document.getElementById('starsDisplay');
  const levelTrack = document.getElementById('levelTrack');
  const completeOverlay = document.getElementById('completeOverlay');
  const completeTitle = document.getElementById('completeTitle');
  const completeSub = document.getElementById('completeSub');
  const nextBtn = document.getElementById('nextBtn');
  const restartAll = document.getElementById('restartAll');

  function buildLevelTrack(){
    levelTrack.innerHTML = '';
    levels.forEach((lvl, i) => {
      const dot = document.createElement('div');
      dot.className = 'level-dot';
      dot.textContent = i + 1;
      if (i === currentLevel) dot.classList.add('active');
      if (i < currentLevel) dot.classList.add('done');
      levelTrack.appendChild(dot);
    });
  }

  function updateStars(){
    let starCount = 3;
    if (misses > 2 && misses <= 5) starCount = 2;
    if (misses > 5) starCount = 1;
    let html = '';
    for (let i = 0; i < 3; i++){
      html += i < starCount ? '<span class="lit">★</span>' : '<span>★</span>';
    }
    starsDisplay.innerHTML = html;
  }

  function loadWord(){
    const lvl = levels[currentLevel];
    const w = lvl.words[currentWord];
    instructionText.textContent = lvl.instruction;
    mascotMsg.textContent = lvl.mascot;
    picture.textContent = w.emoji;
    progressText.textContent = `Word ${currentWord + 1} / ${lvl.words.length}`;
    topRow.innerHTML = '';
    bottomRow.innerHTML = '';
    actionsRow.innerHTML = '';
    updateStars();

    if (currentLevel === 0){
      w.options.forEach((letter) => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        btn.textContent = letter;
        btn.addEventListener('click', () => handleFindL(btn, letter, w.word));
        bottomRow.appendChild(btn);
      });
    }

    if (currentLevel === 1){
      [...w.pattern].forEach((ch) => {
        const slot = document.createElement('div');
        slot.className = 'slot fixed';
        slot.textContent = ch === '_' ? '' : ch;
        topRow.appendChild(slot);
      });
      w.choices.forEach((letter) => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        btn.textContent = letter;
        btn.addEventListener('click', () => handleComplete(btn, letter, w));
        bottomRow.appendChild(btn);
      });
    }

    if (currentLevel === 2){
      builtSoFar = "";
      renderBuildSlots(w.word.length);
      w.bank.forEach((letter) => {
        const btn = document.createElement('button');
        btn.className = 'tile';
        btn.textContent = letter;
        btn.addEventListener('click', () => handleBuild(btn, letter, w.word));
        bottomRow.appendChild(btn);
      });
      const clearBtn = document.createElement('button');
      clearBtn.className = 'link-btn';
      clearBtn.textContent = 'Clear and try again';
      clearBtn.addEventListener('click', () => loadWord());
      actionsRow.appendChild(clearBtn);
    }
  }

  function renderBuildSlots(length){
    topRow.innerHTML = '';
    for (let i = 0; i < length; i++){
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.id = 'slot-' + i;
      if (builtSoFar[i]){
        slot.textContent = builtSoFar[i];
        slot.classList.add('filled');
      }
      topRow.appendChild(slot);
    }
  }

  function handleFindL(btn, letter, word){
    if (letter === word[0]){
      celebrateAndAdvance();
    } else {
      misses++;
      shakeEl(btn);
      updateStars();
    }
  }

  function handleComplete(btn, letter, w){
    if (letter === w.answer){
      celebrateAndAdvance();
    } else {
      misses++;
      shakeEl(btn);
      updateStars();
    }
  }

  function handleBuild(btn, letter, word){
    if (btn.classList.contains('used')) return;
    builtSoFar += letter;
    btn.classList.add('used');
    renderBuildSlots(word.length);

    if (builtSoFar.length === word.length){
      if (builtSoFar === word){
        setTimeout(celebrateAndAdvance, 250);
      } else {
        misses++;
        updateStars();
        setTimeout(() => {
          document.querySelectorAll('.slot').forEach(s => s.classList.add('shake'));
          setTimeout(() => { loadWord(); }, 400);
        }, 200);
      }
    }
  }

  function shakeEl(el){
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 350);
  }

  function celebrateAndAdvance(){
    mascotMsg.textContent = encourage[Math.floor(Math.random() * encourage.length)];
    const lvl = levels[currentLevel];
    if (currentWord < lvl.words.length - 1){
      currentWord++;
      setTimeout(loadWord, 500);
    } else {
      setTimeout(showComplete, 500);
    }
  }

  function showComplete(){
    const isLast = currentLevel === levels.length - 1;
    completeTitle.textContent = isLast ? "You built them all!" : "Great job!";
    completeSub.textContent = isLast
      ? "You finished every level. You are a real word builder now."
      : "You built every word. Ready for the next level?";
    nextBtn.textContent = isLast ? "Play again from level 1" : "Next level →";
    completeOverlay.classList.add('show');
  }

  function loadLevel(idx){
    currentLevel = idx;
    currentWord = 0;
    misses = 0;
    completeOverlay.classList.remove('show');
    buildLevelTrack();
    loadWord();
  }

  nextBtn.addEventListener('click', () => {
    if (currentLevel === levels.length - 1){
      loadLevel(0);
    } else {
      loadLevel(currentLevel + 1);
    }
  });

  restartAll.addEventListener('click', () => loadLevel(0));

  loadLevel(0);
</script>
</body>
</html>
